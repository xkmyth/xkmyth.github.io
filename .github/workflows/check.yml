name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS 语法检查
        run: node --check main.js

      - name: HTML 结构与本地引用检查
        run: |
          python3 - <<'EOF'
          import re, os, sys
          from html.parser import HTMLParser

          errors = []

          for page in ("index.html",):
              if not os.path.exists(page):
                  errors.append(f"missing {page}")
                  continue
              text = open(page, encoding="utf-8").read()

              class P(HTMLParser):
                  def error(self, message):
                      errors.append(f"{page}: {message}")

              p = P()
              try:
                  p.feed(text)
                  p.close()
              except Exception as e:
                  errors.append(f"{page} parse: {e}")

              # 本地引用必须存在
              for m in re.finditer(r'(?:href|src)="(\./[^"#?]*|(?![a-z]+:)[^"#?/][^"#?]*)"', text):
                  target = m.group(1).lstrip("./")
                  if target and not os.path.exists(target):
                      errors.append(f"{page}: dead local ref -> {target}")

          # 页内锚点必须存在
          text = open("index.html", encoding="utf-8").read()
          anchors = set(re.findall(r'id="([^"]+)"', text))
          for m in re.finditer(r'href="#([^"]+)"', text):
              if m.group(1) not in anchors:
                  errors.append(f"index.html: dead anchor -> #{m.group(1)}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("html/refs OK")
          EOF

      - name: 外链连通性（仅警告）
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, sys
          import urllib.request, urllib.error

          text = open("index.html", encoding="utf-8").read()
          links = set(re.findall(r'href="(https?://[^"]+)"', text))
          warn = 0
          for url in sorted(links):
              if "github.com" in url:
                  continue  # GitHub 主链路，跳过
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "xkmyth-ci"})
                  urllib.request.urlopen(req, timeout=15)
                  print(f"OK   {url}")
              except Exception as e:
                  warn += 1
                  print(f"WARN {url} -> {e}")
          print(f"external links: {len(links)}, warnings: {warn}")
          EOF
