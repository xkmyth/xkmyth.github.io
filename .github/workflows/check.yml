name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS 语法检查
        run: |
          for f in $(git ls-files '*.js'); do
            echo "· $f"
            node --check "$f"
          done

      - name: HTML 结构 / 本地引用 / 锚点
        run: |
          python3 - <<'EOF'
          """本地可跑的 HTML 结构与引用检查器 —— 与 CI 内嵌逻辑完全一致。

          用法：python check_html.py <repo_root>
          - 错误（锚点死链、相对路径死链、解析失败）→ 退出码 1
          - 警告（根绝对路径但本仓不存在，通常指向兄弟 Pages 仓库）→ 只打印，不影响退出码
          """
          import os
          import re
          import sys
          from html.parser import HTMLParser

          SKIP_DIRS = {".git", "node_modules", ".github"}
          SKIP_PREFIX = ("http://", "https://", "mailto:", "tel:", "data:", "javascript:")


          def _site_root(page, fallback):
              """页面所属站点根：最近的带 .git / .nojekyll 的祖先目录。"""
              d = os.path.dirname(os.path.abspath(page))
              while True:
                  if os.path.exists(os.path.join(d, ".git")) or os.path.exists(os.path.join(d, ".nojekyll")):
                      return d
                  parent = os.path.dirname(d)
                  if parent == d:
                      return fallback
                  d = parent


          def check(root):
              errors = []
              warnings = []
              seen_warn = set()
              pages = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
                  for fn in filenames:
                      if fn.endswith(".html"):
                          pages.append(os.path.join(dirpath, fn))
              pages.sort()

              for page in pages:
                  rel = os.path.relpath(page, root).replace("\\", "/")
                  text = open(page, encoding="utf-8").read()

                  class P(HTMLParser):
                      def error(self, message):
                          errors.append(f"{rel}: parse error: {message}")

                  try:
                      p = P()
                      p.feed(text)
                      p.close()
                  except Exception as e:
                      errors.append(f"{rel}: parse: {e}")

                  anchors = set(re.findall(r'id="([^"]+)"', text))
                  for m in re.finditer(r'(?:href|src)="([^"]+)"', text):
                      target = m.group(1).strip()
                      if not target or target.startswith(SKIP_PREFIX):
                          continue
                      if target.startswith("#"):
                          name = target[1:]
                          if name and name not in anchors:
                              errors.append(f"{rel}: dead anchor -> {target}")
                          continue
                      path = target.split("#")[0].split("?")[0]
                      if not path:
                          continue
                      is_root_abs = path.startswith("/")
                      if is_root_abs:
                          resolved = os.path.join(_site_root(page, root), path.lstrip("/"))
                      else:
                          resolved = os.path.join(os.path.dirname(page), path)
                      if resolved.endswith("/") or not os.path.splitext(resolved)[1]:
                          candidate = os.path.join(resolved, "index.html")
                          if os.path.exists(candidate):
                              resolved = candidate
                          elif resolved.endswith("/"):
                              resolved = candidate
                      if not os.path.exists(resolved):
                          if is_root_abs:
                              key = (rel, target)
                              if key not in seen_warn:
                                  seen_warn.add(key)
                                  warnings.append(f"{rel}: sibling-site ref -> {target}")
                          else:
                              errors.append(f"{rel}: dead local ref -> {target}")

              return pages, errors, warnings
          pages, errors, warnings = check(os.getcwd())
          if warnings:
              targets = sorted({w.split("sibling-site ref -> ")[-1] for w in warnings})
              shown = ", ".join(targets[:12]) + (" ..." if len(targets) > 12 else "")
              print("WARN 跨站绝对路径 %d 处（兄弟 Pages 仓库，仅提示）：%s" % (len(warnings), shown))
          if errors:
              print("\n".join(errors))
              print("--- %d 个问题 / %d 个页面 ---" % (len(errors), len(pages)))
              sys.exit(1)
          print("checked %d page(s): html/links/anchors OK" % len(pages))
          EOF

      - name: 外链连通性（仅警告）
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import os, re
          import urllib.request

          urls = set()
          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = [d for d in dirnames if d not in (".git", "node_modules")]
              for fn in filenames:
                  if fn.endswith(".html"):
                      text = open(os.path.join(dirpath, fn), encoding="utf-8").read()
                      urls.update(re.findall(r'href="(https?://[^"]+)"', text))
          warns = 0
          for url in sorted(urls):
              if "github.com" in url:
                  continue
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "xkmyth-ci"})
                  urllib.request.urlopen(req, timeout=15)
              except Exception as e:
                  warns += 1
                  print(f"WARN {url} -> {e}")
          print("external links: %d, warnings: %d" % (len(urls), warns))
          EOF
